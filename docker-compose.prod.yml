version: '3.8'

networks:
  socialforge-prod-net:
    driver: bridge

volumes:
  mysqldata:
  redisdata:
  miniodata:
  uploadsdata:

services:
  mysql:
    image: mysql:8.0
    container_name: socialforge-prod-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_NAME:-socialforge_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      # Bound to localhost to prevent public internet exposure
      - "127.0.0.1:${DB_PORT:-3308}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      - socialforge-prod-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:7.2-alpine
    container_name: socialforge-prod-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      # Bound to localhost to prevent unauthenticated remote execution
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - socialforge-prod-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  minio:
    image: minio/minio:latest
    container_name: socialforge-prod-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio_secure_password}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - socialforge-prod-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: socialforge-prod-api
    restart: unless-stopped
    ports:
      # Bound to localhost so all public ingress flows through the Nginx reverse proxy
      - "127.0.0.1:4000:4000"
    command: sh -c "node apps/api/dist/db/migrate.js && node apps/api/dist/index.js"
    environment:
      NODE_ENV: production
      PORT: 4000
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost}
      DATABASE_URL: mysql://root:${DB_PASSWORD:-root}@mysql:3306/${DB_NAME:-socialforge_db}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-socialforge_db}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-socialforge-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio_admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio_secure_password}
      JWT_SECRET: ${JWT_SECRET:-production_secure_jwt_secret_32_characters_long_!}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # SaaS Stripe Billing Configuration
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID_STARTER: ${STRIPE_PRICE_ID_STARTER:-price_starter_monthly}
      STRIPE_PRICE_ID_GROWTH: ${STRIPE_PRICE_ID_GROWTH:-price_growth_monthly}
      STRIPE_PRICE_ID_AGENCY: ${STRIPE_PRICE_ID_AGENCY:-price_agency_monthly}
      STRIPE_PRICE_ID_AGENCY_SCALE: ${STRIPE_PRICE_ID_AGENCY_SCALE:-price_agency_scale_monthly}
      STRIPE_PRICE_ID_SCALE: ${STRIPE_PRICE_ID_SCALE:-price_scale_monthly}
      STRIPE_PRICE_ID_ENTERPRISE: ${STRIPE_PRICE_ID_ENTERPRISE:-price_enterprise_custom}
      # Meta Social Integration Configuration
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v20.0}
      META_DEV_ACCESS_TOKEN: ${META_DEV_ACCESS_TOKEN:-}
      META_TEST_MODE: ${META_TEST_MODE:-false}
      # Omnichannel & Transactional Email
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-"SocialForge" <noreply@socialforge.io>}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v20.0}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
    volumes:
      - uploadsdata:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - socialforge-prod-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: socialforge-prod-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://root:${DB_PASSWORD:-root}@mysql:3306/${DB_NAME:-socialforge_db}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-socialforge_db}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-socialforge-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio_admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio_secure_password}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v20.0}
      META_DEV_ACCESS_TOKEN: ${META_DEV_ACCESS_TOKEN:-}
      META_TEST_MODE: ${META_TEST_MODE:-false}
    volumes:
      - uploadsdata:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - socialforge-prod-net
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node apps/worker/dist/index.js' > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: socialforge-prod-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - socialforge-prod-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
