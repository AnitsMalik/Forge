global
    log stdout format raw local0 info
    maxconn 10000

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  60000ms
    timeout server  60000ms

# Edge Load Balancer Frontend
frontend alb_frontend
    bind *:80
    mode http
    
    # Path-based routing: /api and /health routes to API fleet
    acl is_api path_beg /api
    acl is_health path /health
    acl is_auth path_beg /auth

    use_backend api_fleet if is_api or is_health or is_auth
    default_backend web_frontend

# API Fleet Backend with round-robin load balancing
backend api_fleet
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    default-server check inter 3000 rise 2 fall 3
    server api1 api-1:4000
    server api2 api-2:4000
    server api3 api-3:4000

# Frontend Web SPA Backend
backend web_frontend
    mode http
    balance roundrobin
    server web web:80 check
