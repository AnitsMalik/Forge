global
    log stdout format raw local0 info
    maxconn 4000

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

# Frontend for API and Worker connection multiplexing
frontend mysql_proxy_in
    bind *:3306
    mode tcp
    default_backend mysql_backend

# Backend MySQL writer target
backend mysql_backend
    mode tcp
    balance roundrobin
    option tcp-check
    server mysql_primary mysql-primary:3306 check maxconn 500
